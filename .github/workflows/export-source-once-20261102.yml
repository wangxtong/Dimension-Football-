name: One-off private full source archive
on:
  push:
    branches:
      - 'artifact/export-main-40e7e089-20261102'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Archive only the exact original main commit
        env:
          SOURCE_SHA: '40e7e0898c73ce409ff4fda2e589ef5bc5de43ce'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          out="$RUNNER_TEMP/Dimension-Football-main-${SOURCE_SHA:0:12}.zip"
          git archive --format=zip --output="$out" "$SOURCE_SHA"
          sha256sum "$out" > "$RUNNER_TEMP/SHA256SUMS.txt"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/SOURCE_SHA.txt"
          unzip -t "$out" | tail -n 3
      - name: Upload private one-off archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension-football-main-40e7e089-full
          path: |
            ${{ runner.temp }}/Dimension-Football-main-40e7e0898c73.zip
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 1
