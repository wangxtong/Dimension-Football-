name: One-off Big Five Eight-Season CC0 CSV Export
on:
  push:
    branches:
      - artifact/big5-historical-csv-2018-2026
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout private isolated export script (no deploy)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download publicly licensed OpenFootball at pinned SHA
        shell: bash
        env:
          UPSTREAM_SHA: e6744429ee395bc86f247348c6184bb08d4eb361
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/openfootball-data"
          git clone --quiet --depth 1 --branch master https://github.com/openfootball/football.json.git "$src"
          if [ "$(git -C "$src" rev-parse HEAD)" != "$UPSTREAM_SHA" ]; then
            git -C "$src" fetch --quiet --depth 1 origin "$UPSTREAM_SHA"
            git -C "$src" checkout --quiet --detach "$UPSTREAM_SHA"
          fi
          test "$(git -C "$src" rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -f "$src/LICENSE.md"
          test -f "$src/2018-19/en.1.json"
          test -f "$src/2025-26/fr.1.json"
          echo "PUBLIC_SOURCE_PIN_VERIFIED:$UPSTREAM_SHA"
      - name: Generate 40 season CSVs, combined CSV, provenance and integrity ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export_big5_historical_csv_20261102.py \
            "$RUNNER_TEMP/openfootball-data" \
            "$RUNNER_TEMP/Big5_2018-19_to_2025-26_40_CSV.zip" | tee "$RUNNER_TEMP/export-stats.json"
          test -s "$RUNNER_TEMP/Big5_2018-19_to_2025-26_40_CSV.zip"
          sha256sum "$RUNNER_TEMP/Big5_2018-19_to_2025-26_40_CSV.zip" | tee "$RUNNER_TEMP/export-zip-sha256.txt"
      - name: Upload source-only user-requested archive (private CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Big5_2018-19_to_2025-26_40_CSV
          path: |
            ${{ runner.temp }}/Big5_2018-19_to_2025-26_40_CSV.zip
            ${{ runner.temp }}/export-stats.json
            ${{ runner.temp }}/export-zip-sha256.txt
          if-no-files-found: error
          retention-days: 2

      - name: Verify and commit 40 CSV files and manifests to isolated dataset branch only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "artifact/big5-historical-csv-2018-2026"
          path="research/datasets/big5-2018-19_to_2025-26"
          mkdir -p "$path"
          unzip -oq "$RUNNER_TEMP/Big5_2018-19_to_2025-26_40_CSV.zip" -d "$path"
          python3 - "$path" <<'PY'
          from pathlib import Path
          import csv, hashlib, json, sys
          root=Path(sys.argv[1])
          manifest=json.loads((root/'MANIFEST.json').read_text())
          csvs=sorted((root/'csv').rglob('*.csv'))
          assert len(csvs)==40
          assert manifest['statistics']=={'total_rows':14386,'ft_scored':14151,'ft_missing':235,'csv_count':40}
          for q in manifest['source_coverage']:
              p=root/q['GeneratedCSVPath']
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==q['GeneratedCSVSHA256']
              with p.open(encoding='utf-8-sig',newline='') as h:
                  rows=list(csv.DictReader(h))
              assert len(rows)==q['Fixtures']
              assert sum(r['FTRecordStatus']=='FT_REPORTED_BY_SOURCE' for r in rows)==q['FTRecorded']
              assert sum(r['FTRecordStatus']!='FT_REPORTED_BY_SOURCE' for r in rows)==q['FTMissing']
          print('IMPORT_VERIFIED:40_CSV:14386_ROWS:14151_FT:235_MISSING')
          PY
          git add -- "$path"
          if git diff --cached --quiet; then
            echo "DATASET_ALREADY_COMMITTED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: archive 40 Big Five CC0 season CSVs [skip ci]"
          git push origin HEAD:"refs/heads/${GITHUB_REF_NAME}"
          echo "DATASET_PUSHED_TO_PRIVATE_ISOLATED_BRANCH"
