name: 采集项目验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm test
      - run: npm run collect:demo
      - run: python -m unittest scripts/test_package.py
      - run: bash -n deploy/*.sh
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix collector/browser-runtime --ignore-scripts --no-fund
      - run: node collector/browser-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run crawler:doctor
      - run: npm run test:browser
