name: 采集项目验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: 校验八岗位职责与只读提示词配置
        run: npm run agents:check
      - name: 恢复按摘要固定的真实报告供必测使用
        run: node scripts/restore-report-fixture.mjs --out "$RUNNER_TEMP/dimension-real-report"
      - name: 恢复五联赛两个赛季的固定公开快照
        run: node scripts/restore-openfootball-fixture.mjs --out "$RUNNER_TEMP/openfootball-fixed"
      - name: 全量回归（包含真实输入和构建 Worker 检查）
        env:
          EVALUATION_TEST_REPORT_DIRECTORY: ${{ runner.temp }}/dimension-real-report
          HOSTED_TEST_REPORT_DIRECTORY: ${{ runner.temp }}/dimension-real-report
          OPENFOOTBALL_SNAPSHOT_DIRECTORY: ${{ runner.temp }}/openfootball-fixed
        run: npm test
      - run: npm run collect:demo
      - name: 验证可选Scrapling公开采集器（无需外部API、无真实网络）
        run: python3 -m unittest discover -s collector/sources/test -p test_scrapling_archive.py -v
      - run: python -m unittest scripts/test_package.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest deploy/test_bundle.py deploy/test_handoff.py
      - run: for script in deploy/*.sh; do bash -n "$script" || exit; done
      - run: node website/build.mjs /tmp/dimension-site-ci
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix collector/browser-runtime --ignore-scripts --no-fund
      - run: node collector/browser-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run crawler:doctor
      - run: npm run test:browser
      - name: 验证实际网站构建、登录与报告页面
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/collector/browser-runtime/node_modules/playwright/index.mjs
        run: node --test --test-isolation=none website/test/e2e.mjs website/test/observation-panels.e2e.mjs
  scrapling-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装固定版本Scrapling HTTP抓取引擎（不安装浏览器、不访问足球源）
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check -r config/scrapling-requirements.txt
          python -c "import importlib.metadata; from scrapling.fetchers import Fetcher; assert importlib.metadata.version('scrapling') == '0.5'; assert callable(Fetcher.get)"
      - name: 离线合约与跨进程哈希复核
        run: python -m unittest discover -s collector/sources/test -p test_scrapling_archive.py -v
  # One bounded real public-source probe for THIS research PR only.
  # Does not change the default hosted collection schedule or send forecasts.
  scrapling-live-public:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/scrapling-public-archive-20261102' }}
    needs: [scrapling-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装固定Scrapling并执行公开德甲一次真实取数
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check -r config/scrapling-requirements.txt
          umask 077
          mkdir -p "$RUNNER_TEMP/scrapling-evidence"
          python3 collector/sources/scrapling_archive.py \
            --source openligadb-bl1-history --season 2025 --live \
            --out-root "$RUNNER_TEMP/scrapling-evidence" \
            > "$RUNNER_TEMP/scrapling-evidence/first-run.json"
      - name: 新独立进程逐字节验证原始来源和完整FT
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'scrapling-evidence'
          receipt = json.loads((root / 'first-run.json').read_text('utf-8'))
          directory = Path(receipt['directory'])
          if not directory.is_relative_to(root) or not directory.is_dir():
              raise SystemExit('ARCHIVE_DIRECTORY_INVALID')
          if receipt['receipt']['observationMode'] != 'LIVE_SOURCE_HTTP' or receipt['receipt']['httpStatus'] != 200:
              raise SystemExit('LIVE_HTTP_NOT_VERIFIED')
          second = subprocess.run([sys.executable, 'collector/sources/scrapling_archive.py',
              '--verify', str(directory)], capture_output=True, text=True, check=True)
          verified = json.loads(second.stdout)
          projection = json.loads((directory / 'projection.json').read_text('utf-8'))
          if verified['rawSha256'] != receipt['receipt']['rawSha256'] or projection['kind'] != 'historical-match-results':
              raise SystemExit('RAW_READBACK_MISMATCH')
          if projection['sourceId'] != 'openligadb' or projection['seasonStart'] != 2025:
              raise SystemExit('SOURCE_IDENTITY_MISMATCH')
          if projection['validIdentities'] != 306 or projection['finishedWithVerifiedFT'] != 306:
              raise SystemExit('UNEXPECTED_HISTORICAL_COUNT')
          public = dict(status='REAL_PUBLIC_HTTP_ARCHIVED_E2', source='openligadb',
              season=2025, recordCount=verified['records'], rawSha256=verified['rawSha256'],
              releaseGate='BLOCKED', forecastPublished=False,
              historicalPregameObserved=False)
          (root / 'verified.json').write_text(json.dumps(public, sort_keys=True)+'\n')
          print(json.dumps(public, sort_keys=True))
          PY
      - name: Node A3数据层跨语言读入同一真实RAW并核resultId
        run: |
          set -euo pipefail
          INPUT_DIRECTORY=$(python3 -c "import json,os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'scrapling-evidence/first-run.json'; print(json.loads(p.read_text())['directory'])")
          mkdir -p "$RUNNER_TEMP/scrapling-evidence/normalized"
          node collector/data/scrapling-history-bridge.mjs \
            "$INPUT_DIRECTORY" "$RUNNER_TEMP/scrapling-evidence/normalized" \
            > "$RUNNER_TEMP/scrapling-evidence/node-import-receipt.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const dir = process.env.RUNNER_TEMP + "/scrapling-evidence/";
            const receipt = JSON.parse(readFileSync(dir+"node-import-receipt.json", "utf8"));
            const batch = JSON.parse(readFileSync(receipt.outputFile, "utf8"));
            const source = JSON.parse(readFileSync(dir+"verified.json", "utf8"));
            assert.equal(receipt.status, "RESEARCH_HISTORICAL_RAW_IMPORTED");
            assert.equal(receipt.rawSha256, source.rawSha256);
            assert.equal(batch.coverage.scoredFT, 306);
            assert.equal(batch.records.length, 306);
            assert.equal(batch.releaseGate, "BLOCKED");
            assert.equal(batch.modelReadyForProspective, false);
            assert.equal(batch.historicalPregameObserved, false);
            console.log(JSON.stringify({status:"REAL_SCRAPLING_TO_NODE_HISTORY_BRIDGE_E2",
              rawSha256:receipt.rawSha256,normalizedSha256:receipt.batchSha256,
              records:receipt.records, releaseGate:receipt.releaseGate}));
          '
      - name: 私有保存本轮原始RAW与二次验真收据（非永久生产存储）
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scrapling-live-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scrapling-evidence/
          if-no-files-found: warn
          retention-days: 14
  release:
    needs: [test, browser, scrapling-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 从通过检查的精确提交生成 ECS 离线部署包
        run: |
          mkdir -p "$RUNNER_TEMP/dimension-ecs"
          python3 deploy/bundle.py build "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$RUNNER_TEMP/dimension-ecs/dimension-ecs-release.tar" > "$RUNNER_TEMP/dimension-ecs/release-metadata.json"
          python3 deploy/bundle.py verify "$RUNNER_TEMP/dimension-ecs/dimension-ecs-release.tar"
          release_sha256=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/dimension-ecs/release-metadata.json")
          python3 deploy/bundle.py extract "$RUNNER_TEMP/dimension-ecs/dimension-ecs-release.tar" "$RUNNER_TEMP/dimension-verified-source" --sha256 "$release_sha256"
          node "$RUNNER_TEMP/dimension-verified-source/collector/orchestrate.mjs" --help
          cp deploy/bootstrap.sh deploy/bundle.py "$RUNNER_TEMP/dimension-ecs/"
          cd "$RUNNER_TEMP/dimension-ecs"
          sha256sum dimension-ecs-release.tar > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dimension-ecs-${{ github.sha }}
          path: ${{ runner.temp }}/dimension-ecs/
          retention-days: 14
          if-no-files-found: error
