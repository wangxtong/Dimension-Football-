name: 维度足球长期采集

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/collection.yml'
  workflow_dispatch:
    inputs:
      demo:
        description: "离线模拟（报告会明确标记模拟，不产生正式候选）"
        type: boolean
        required: false
        default: false
  # GitHub 未指定 timezone 时使用 UTC；每小时整点也对应北京时间每小时整点。
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

# 正在运行的一轮不被后一轮取消；同组最多一轮执行，避免检查点竞争。
concurrency:
  group: dimension-football-collection
  cancel-in-progress: false

jobs:
  collect:
    # 主分支更新执行一次应用验收；定时采集仍需要显式开启仓库变量。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.VANTIS_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COLLECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.demo && 'demo' || 'production' }}
      STATE_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.demo && '.collection-state-demo' || '.collection-state' }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 使用 Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 恢复采集检查点
        id: restore-state
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.STATE_DIR }}/state.json
            ${{ env.STATE_DIR }}/state.json.sources.json
            ${{ env.STATE_DIR }}/state.json.crawl.json
            ${{ env.STATE_DIR }}/state.json.providers.json
          # cache 不可覆盖；每次执行及重新执行均创建独立条目。
          key: collection-v4-${{ runner.os }}-${{ github.ref_name }}-${{ env.COLLECTION_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            collection-v4-${{ runner.os }}-${{ github.ref_name }}-${{ env.COLLECTION_MODE }}-
            collection-v3-${{ runner.os }}-${{ github.ref_name }}-${{ env.COLLECTION_MODE }}-

      - name: 主分支应用验收（有赛程配置才采集，最多 5 分钟）
        if: github.event_name == 'push'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          FIXTURES_FILE: ${{ vars.FIXTURES_FILE }}
        shell: bash
        run: npm run sources:activate -- --state "$STATE_DIR/state.json" --out reports --budget-minutes 5

      - name: 执行一轮正式采集（最多 20 分钟）
        if: env.COLLECTION_MODE == 'production' && github.event_name != 'push'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          FIXTURES_FILE: ${{ vars.FIXTURES_FILE }}
        shell: bash
        run: npm run collect -- --state "$STATE_DIR/state.json" --out reports --budget-minutes 20

      - name: 执行一轮离线模拟（不注入生产密钥）
        if: env.COLLECTION_MODE == 'demo'
        shell: bash
        run: npm run collect -- --demo --state "$STATE_DIR/state.json" --out reports --budget-minutes 20

      - name: 保存最新检查点（采集失败时也尝试保存）
        if: always() && hashFiles(format('{0}/state.json', env.STATE_DIR), format('{0}/state.json.sources.json', env.STATE_DIR), format('{0}/state.json.crawl.json', env.STATE_DIR), format('{0}/state.json.providers.json', env.STATE_DIR)) != ''
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.STATE_DIR }}/state.json
            ${{ env.STATE_DIR }}/state.json.sources.json
            ${{ env.STATE_DIR }}/state.json.crawl.json
            ${{ env.STATE_DIR }}/state.json.providers.json
          key: collection-v4-${{ runner.os }}-${{ github.ref_name }}-${{ env.COLLECTION_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 保留本轮报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-${{ env.COLLECTION_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
