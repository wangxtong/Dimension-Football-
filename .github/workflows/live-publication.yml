name: 持久采集与网站发布（Sites 主执行端）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observations 更新赛程观察；research 仅私有采集、冻结与核账，不发布或通知'
        type: choice
        default: observations
        options: [observations, research]
  # GitHub schedules are best effort; five minutes is a target, not an SLA.
  schedule:
    - cron: '*/5 * * * *'
    # 每日北京时间10:10一次研究冻结与赛后核账；不是24h SLA。
    - cron: '10 2 * * *'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - 'website/report-schema.mjs'
      - '.github/workflows/live-publication.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  # Serialize with the existing archive workflow and its pre-upgrade runs.
  group: dimension-football-public-sample
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COLLECTOR_COMMIT: ${{ github.sha }}
      # Collection/state can advance; publication requires the reviewed report gate.
      RELEASE_GATE: BLOCKED
      HOSTED_MARKET_OBSERVATIONS: 'true'
      HOSTED_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '10 2 * * *' && 'research' || github.event_name == 'workflow_dispatch' && inputs.mode || 'observations' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 恢复持久状态、分层采集并核验原站点（最多 3 分钟）
        run: node collector/hosted.mjs --root "$RUNNER_TEMP/dimension-live" --budget-minutes 3 --mode "$HOSTED_MODE"
      - name: 研究轨道生成每日1X2冻结快照和真实FT复盘（不触发正式预测外发）
        if: success() && env.HOSTED_MODE == 'research'
        run: node collector/research-daily-report.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 将研究日报同步至受保护Web并核验同reportId（需独立QA准入）
        if: success() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_WEB_ENABLED == 'true'
        run: node collector/publish-research-daily.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 研究日报推送到Telegram（所有者授权的个人研究用途；严格候选与商业门禁保持BLOCKED）
        if: success() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node collector/publish-research-telegram.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 北京时间 09 点后核验并发送当天赛事与数据状态日报
        if: success() && env.HOSTED_MODE == 'observations'
        run: node collector/observation-digest.mjs --root "$RUNNER_TEMP/dimension-live" --mode "$HOSTED_MODE"
      - name: 保留本轮采集与运行证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dimension-live/
            !${{ runner.temp }}/dimension-live/**/*.lock
            !${{ runner.temp }}/dimension-live/**/*.env
            !${{ runner.temp }}/dimension-live/**/.env*
            !${{ runner.temp }}/dimension-live/**/*secret*
            !${{ runner.temp }}/dimension-live/**/*credential*
            !${{ runner.temp }}/dimension-live/**/*token*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 90
      - name: 说明运行与交付边界
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Sites 持久采集与发布

          RELEASE_GATE=BLOCKED：采集公开赛程及未来 24 小时受检赛事的独立报价，网站仅刷新赛程和来源覆盖统计；不包含原始盘口、预测概率或正式候选，不创建预测账本。采集步骤本身不发送通知。
          调度目标为每 5 分钟；GitHub 排队、并发与上游预算可能导致延迟。
          公开赛程仅到 15 分钟采集周期才请求；未到期保持原始观测时间，不把缓存标为刚更新。
          市场观察目标为每 5 分钟，保留来源原始时间；赛程超过 20 分钟或报价过期时拒绝作为最新有效观察发布。
          状态来自原 Sites 的持久存储，以 revision 做条件更新；冲突或超限会停止，不使用空状态替代失败恢复。
          独立日报步骤在北京时间 09 点后，重新核验本轮同一观察报告后申请 Sites 发送当天赛事与数据状态；Sites 持久账本每日防重，未知结果不自动重发。日报不是预测推荐，runner 与 Sites 均不发送自动预测。
          Telegram 凭据仅绑定 Sites 运行环境，runner 仅提交已核验的报告 ID；缺少或错误配置会明确失败，附件仅保存脱敏回执。状态日报接通不代表用户要求的正式预测日报已完成。
          本轮采集与运行记录保留为 90 天附件；research 模式支持每日上午北京时间10:10计划调度，赛前冻结研究1X2、优先核账真实FT，并在私有Actions附件生成独立研究日报。0合格预测按0输出；不调用正式发布/Telegram；计划触发不等于必定准时。
          研究日报与正式商业发布门禁隔离：正式 RELEASE_GATE 仍BLOCKED；严格盘口双独立来源+真实初盘门禁保持不变。私有研究冻结不是已公开发布预测成绩；研究输出只在受限附件内，Web/TG研究展示仍需独立安全验收。
          R2 保存观察报告与当前状态，既有预测账本不删除。
          网站成功仅以同 reportId、同报告摘要、hosted/available 实际回读为准；本工作流不表示 ECS 已部署。
          EOF
