name: 持久采集与网站发布（Sites 主执行端）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observations 更新赛程观察；research 仅私有采集、冻结与核账，不发布或通知'
        type: choice
        default: observations
        options: [observations, research]
  # GitHub schedules are best effort; five minutes is a target, not an SLA.
  schedule:
    - cron: '*/5 * * * *'
    # 每日北京时间10:10一次研究冻结与赛后核账；不是24h SLA。
    # 该 cron 与 */5 在 UTC 02:10 同时命中（10 能被 5 整除）。GitHub 为每个匹配的 cron
    # 各触发一次运行，并用 github.event.schedule 区分（官方文档：A single workflow can be
    # triggered by multiple schedule events. Access the schedule event that triggered the
    # workflow through the github.event.schedule context.）。所以 10:10 那次运行的
    # github.event.schedule 就是 '10 2 * * *'，HOSTED_MODE 必然解析为 research。
    # 下面“记录调度来源与运行模式”步骤对该解析做运行期断言，不靠注释与手工检查。
    - cron: '10 2 * * *'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - 'website/report-schema.mjs'
      - '.github/workflows/live-publication.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  # Serialize with the existing archive workflow and its pre-upgrade runs.
  group: dimension-football-public-sample
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COLLECTOR_COMMIT: ${{ github.sha }}
      # Collection/state can advance; publication requires the reviewed report gate.
      RELEASE_GATE: BLOCKED
      HOSTED_MARKET_OBSERVATIONS: 'true'
      HOSTED_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '10 2 * * *' && 'research' || github.event_name == 'workflow_dispatch' && inputs.mode || 'observations' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 记录调度来源与运行模式（10:10 定时必须解析为 research）
        run: |
          echo "event=${GITHUB_EVENT_NAME} schedule=${{ github.event.schedule }} ref=${GITHUB_REF}"
          echo "HOSTED_MODE=${HOSTED_MODE} 北京时间=$(TZ=Asia/Shanghai date '+%F %T')"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${{ github.event.schedule }}" = "10 2 * * *" ] && [ "${HOSTED_MODE}" != "research" ]; then
            echo "RESEARCH_MODE_MISMATCH: 10:10 定时必须进入 research，实际为 ${HOSTED_MODE}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/5 * * * *" ] && [ "${HOSTED_MODE}" = "research" ]; then
            echo "RESEARCH_MODE_UNEXPECTED: 5 分钟采集不得进入 research" >&2
            exit 1
          fi
      - name: 恢复持久状态、分层采集并核验原站点（最多 3 分钟）
        run: node collector/hosted.mjs --root "$RUNNER_TEMP/dimension-live" --budget-minutes 3 --mode "$HOSTED_MODE"
      - name: 研究轨道生成每日1X2冻结快照和真实FT复盘（不触发正式预测外发）
        if: success() && env.HOSTED_MODE == 'research'
        run: node collector/research-daily-report.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 核验研究日报：0 场必须是真实无合格场次，异常状态禁止推送
        id: research_report_gate
        if: always() && env.HOSTED_MODE == 'research'
        env:
          RESEARCH_ROOT: ${{ runner.temp }}/dimension-live
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/research-report-gate.mjs" <<'RESEARCH_REPORT_GATE'
          import { appendFile, readFile } from 'node:fs/promises';
          import { join, resolve } from 'node:path';

          const fail = code => { console.error(code); process.exit(1); };
          let report;
          try {
            report = JSON.parse(await readFile(join(resolve(process.env.RESEARCH_ROOT), 'reports/research-daily/latest.json'), 'utf8'));
          } catch {
            fail('RESEARCH_REPORT_MISSING_OR_UNREADABLE');
          }
          const deliverableStates = new Set(['frozen-research-forecasts', 'zero-qualified-forecasts']);
          if (report?.kind !== 'research-daily-1x2' || report?.mode !== 'research-reference') fail('RESEARCH_REPORT_INVALID');
          if (report?.commercialReleaseGate !== 'BLOCKED' || report?.strictMarkets?.releasedCandidates !== 0) fail('RESEARCH_RELEASE_GATE_MISMATCH');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(report?.beijingDay || '')) fail('RESEARCH_REPORT_DAY_INVALID');
          if (!deliverableStates.has(report.state)) fail('RESEARCH_REPORT_STATE_NOT_DELIVERABLE:' + String(report.state));
          const total = report.forecasts?.total;
          const candidates = report.forecasts?.candidates?.length;
          if (!Number.isSafeInteger(total) || total !== candidates) fail('RESEARCH_REPORT_COUNT_MISMATCH');
          if ((report.state === 'frozen-research-forecasts') !== (total > 0)) fail('RESEARCH_REPORT_STATE_COUNT_CONFLICT');
          console.log(JSON.stringify({ reportId: report.reportId, beijingDay: report.beijingDay, state: report.state, total,
            meaning: total > 0 ? '今日有合格研究场次' : '36 小时窗口内无合格场次，按 0 场如实推送' }));
          if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, 'beijingDay=' + report.beijingDay + '\n');
          RESEARCH_REPORT_GATE
          node "$RUNNER_TEMP/research-report-gate.mjs"
      - name: 将研究日报同步至受保护Web并核验同reportId（需独立QA准入）
        if: success() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_WEB_ENABLED == 'true'
        run: node collector/publish-research-daily.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 恢复研究日报当日送达标记（跨 runner 幂等；缓存不可用时仍继续，最多退化为一次重复）
        id: telegram_delivery_cache
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true' && steps.research_report_gate.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/research-delivery
          key: research-telegram-${{ steps.research_report_gate.outputs.beijingDay }}
      - name: 今日研究日报已送达（跳过重复推送）
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true' && steps.telegram_delivery_cache.outputs.cache-hit == 'true'
        run: |
          echo "北京时间 ${{ steps.research_report_gate.outputs.beijingDay }} 的研究日报已送达，今天不再重复推送。"
          cat "$RUNNER_TEMP/research-delivery/marker.json" 2>/dev/null || true
      - name: Telegram 通道只读预检（getMe/getChat；不发送消息、不输出凭据）
        id: telegram_preflight
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true' && steps.research_report_gate.outcome == 'success' && steps.telegram_delivery_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/telegram-preflight.mjs" <<'TELEGRAM_PREFLIGHT'
          import { createHash } from 'node:crypto';

          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          const say = value => console.log(JSON.stringify(value));
          if (!token || !chatId) {
            say({ probe: 'credentials', code: 'TELEGRAM_CREDENTIALS_REQUIRED' });
            process.exit(0);
          }
          const fingerprint = value => createHash('sha256').update(String(value)).digest('hex').slice(0, 16);
          const call = async (method, payload) => {
            const init = payload === undefined
              ? { method: 'GET' }
              : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) };
            const response = await fetch('https://api.telegram.org/bot' + token + '/' + method,
              { ...init, redirect: 'error', signal: AbortSignal.timeout(10000) });
            let data = null;
            try { data = await response.json(); } catch { /* 响应正文不落日志 */ }
            return { httpStatus: response.status, ok: data?.ok === true,
              description: typeof data?.description === 'string' ? data.description.slice(0, 160) : null,
              username: method === 'getMe' && typeof data?.result?.username === 'string' ? data.result.username : null,
              type: method === 'getChat' && typeof data?.result?.type === 'string' ? data.result.type : null };
          };
          try {
            const me = await call('getMe');
            say({ probe: 'getMe', httpStatus: me.httpStatus, ok: me.ok, botUsername: me.ok ? me.username : null,
              description: me.ok ? null : me.description });
            const chat = await call('getChat', { chat_id: chatId });
            say({ probe: 'getChat', httpStatus: chat.httpStatus, ok: chat.ok, chatType: chat.ok ? chat.type : null,
              destinationFingerprint: fingerprint(chatId), description: chat.ok ? null : chat.description });
          } catch {
            say({ probe: 'skipped', code: 'TELEGRAM_PREFLIGHT_NETWORK_ERROR' });
          }
          TELEGRAM_PREFLIGHT
          node "$RUNNER_TEMP/telegram-preflight.mjs"
      - name: 研究日报推送到Telegram（所有者授权的个人研究用途；严格候选与商业门禁保持BLOCKED）
        id: telegram_push
        # Telegram 是独立通道：Web 同步失败（如线上 Worker 版本落后）不应连带阻断每日推送。
        # 但“研究日报缺失/状态异常”不得推送：research_report_gate 失败时本步骤不执行。
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true' && steps.research_report_gate.outcome == 'success' && steps.telegram_delivery_cache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          node collector/publish-research-telegram.mjs --root "$RUNNER_TEMP/dimension-live" | tee "$RUNNER_TEMP/telegram-delivery.json"
      - name: 核验 Telegram 送达结果（failed/unknown 必须让流水线变红并输出 messageId）
        id: telegram_delivery_check
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true' && steps.research_report_gate.outcome == 'success' && steps.telegram_push.outcome == 'success'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/telegram-delivery-check.mjs" <<'TELEGRAM_DELIVERY_CHECK'
          import { appendFile, mkdir, readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const fail = code => { console.error(code); process.exit(1); };
          let result = null;
          try {
            const lines = (await readFile(resolve(process.env.RUNNER_TEMP, 'telegram-delivery.json'), 'utf8'))
              .split('\n').map(line => line.trim()).filter(Boolean);
            result = JSON.parse(lines.at(-1));
          } catch {
            fail('TELEGRAM_DELIVERY_RESULT_MISSING');
          }
          const accepted = result?.status === 'accepted';
          const alreadySent = result?.status === 'skipped' && result?.code === 'ALREADY_SENT_TODAY';
          if (!accepted && !alreadySent) fail('TELEGRAM_DELIVERY_NOT_ACCEPTED:' + String(result?.status) + ':' + String(result?.code));
          if (accepted && !Number.isSafeInteger(result?.messageId)) fail('TELEGRAM_MESSAGE_ID_MISSING');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(result?.beijingDay || '')) fail('TELEGRAM_RECEIPT_DAY_INVALID');
          console.log(JSON.stringify({ status: result.status, code: result.code ?? null, messageId: result.messageId ?? null,
            channel: result.channel ?? null, beijingDay: result.beijingDay, reportId: result.reportId }));
          const directory = resolve(process.env.RUNNER_TEMP, 'research-delivery');
          await mkdir(directory, { recursive: true });
          await writeFile(resolve(directory, 'marker.json'), JSON.stringify({ version: 1, beijingDay: result.beijingDay,
            reportId: result.reportId, status: result.status, messageId: result.messageId ?? null,
            channel: result.channel ?? null, checkedAt: new Date().toISOString() }) + '\n');
          if (process.env.GITHUB_OUTPUT) await appendFile(process.env.GITHUB_OUTPUT, 'delivered=true\n');
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY,
            '- 研究日报 Telegram：' + result.status + (accepted ? '（messageId=' + result.messageId + '，channel=' + String(result.channel) + '）' : '') + '\n');
          TELEGRAM_DELIVERY_CHECK
          node "$RUNNER_TEMP/telegram-delivery-check.mjs"
      - name: 保存研究日报当日送达标记（仅在 Telegram accepted 后；失败不影响本轮结果）
        id: telegram_delivery_save
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true' && steps.telegram_delivery_check.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/research-delivery
          key: research-telegram-${{ steps.research_report_gate.outputs.beijingDay }}
      - name: 北京时间 09 点后核验并发送当天赛事与数据状态日报
        if: success() && env.HOSTED_MODE == 'observations'
        run: node collector/observation-digest.mjs --root "$RUNNER_TEMP/dimension-live" --mode "$HOSTED_MODE"
      - name: 保留本轮采集与运行证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dimension-live/
            !${{ runner.temp }}/dimension-live/**/*.lock
            !${{ runner.temp }}/dimension-live/**/*.env
            !${{ runner.temp }}/dimension-live/**/.env*
            !${{ runner.temp }}/dimension-live/**/*secret*
            !${{ runner.temp }}/dimension-live/**/*credential*
            !${{ runner.temp }}/dimension-live/**/*token*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 90
      - name: 说明运行与交付边界
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Sites 持久采集与发布

          RELEASE_GATE=BLOCKED：采集公开赛程及未来 24 小时受检赛事的独立报价，网站仅刷新赛程和来源覆盖统计；不包含原始盘口、预测概率或正式候选，不创建预测账本。采集步骤本身不发送通知。
          调度目标为每 5 分钟；GitHub 排队、并发与上游预算可能导致延迟。
          公开赛程仅到 15 分钟采集周期才请求；未到期保持原始观察时间，不把缓存标为刚更新。
          市场观察目标为每 5 分钟，保留来源原始时间；赛程超过 20 分钟或报价过期时拒绝作为最新有效观察发布。
          状态来自原 Sites 的持久存储，以 revision 做条件更新；冲突或超限会停止，不使用空状态替代失败恢复。
          独立日报步骤在北京时间 09 点后，重新核验本轮同一观察报告后申请 Sites 发送当天赛事与数据状态；Sites 持久账本每日防重，未知结果不自动重发。日报不是预测推荐，runner 与 Sites 均不发送自动预测。
          Telegram 凭据仅绑定 Sites 运行环境，runner 仅提交已核验的报告 ID；缺少或错误配置会明确失败，附件仅保存脱敏回执。状态日报接通不代表用户要求的正式预测日报已完成。
          本轮采集与运行记录保留为 90 天附件；research 模式支持每日上午北京时间10:10计划调度，赛前冻结研究1X2、优先核账真实FT，并在私有Actions附件生成独立研究日报。0 合格场次按 0 场如实生成并推送，报告不会因 0 场而不生成。
          研究日报使用独立 Telegram 通道：Web 同步失败时不阻断推送；但研究日报缺失、状态异常（no-today-source-report / ledger-not-restored）或 Telegram 返回 failed/unknown 时必须让流水线变红，不接受静默成功。同一天重复触发（定时 + 手动 dispatch）由 Actions 缓存里的当日送达标记去重；缓存不可用时最多退化为一次重复。
          定时 10:10 仅由 GitHub schedule 触发，调度为尽力而为：官方文档说明高负载时可能延迟、排队任务可能被丢弃。本工作流不做自动补跑，10:10 被丢弃时需人工 workflow_dispatch 或外部定时器兜底。
          研究日报与正式商业发布门禁隔离：正式 RELEASE_GATE 仍BLOCKED；严格盘口双独立来源+真实初盘门禁保持不变。私有研究冻结不是已公开发布预测成绩；研究输出只在受限附件内，Web/TG研究展示仍需独立安全验收。
          R2 保存观察报告与当前状态，既有预测账本不删除。
          网站成功仅以同 reportId、同报告摘要、hosted/available 实际回读为准；本工作流不表示 ECS 已部署。
          EOF
