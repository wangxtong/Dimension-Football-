name: 持久采集与网站发布（Sites 主执行端）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observations 更新赛程观察；research 仅私有采集、冻结与核账，不发布或通知'
        type: choice
        default: observations
        options: [observations, research]
  # GitHub schedules are best effort; five minutes is a target, not an SLA.
  schedule:
    - cron: '*/5 * * * *'
    # 每日北京时间10:10一次研究冻结与赛后核账；不是24h SLA。
    - cron: '10 2 * * *'
    # 补偿轮已移除：实测 Actions cache 当日标记在本仓库不能稳定跨 run 命中，
    # 10:40 补偿轮会重复推送同一份日报。schedule 丢跑时改为人工 dispatch（见 docs）。
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - 'website/report-schema.mjs'
      - '.github/workflows/live-publication.yml'

permissions:
  # 降级通道需要把最近一期研究日报提交到 docs/latest-daily.md；
  # 这是本仓库内唯一用途，不放宽其它权限。
  contents: write
  id-token: write

concurrency:
  # Serialize with the existing archive workflow and its pre-upgrade runs.
  group: dimension-football-public-sample
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COLLECTOR_COMMIT: ${{ github.sha }}
      # Collection/state can advance; publication requires the reviewed report gate.
      RELEASE_GATE: BLOCKED
      HOSTED_MARKET_OBSERVATIONS: 'true'
      HOSTED_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '10 2 * * *' && 'research' || github.event_name == 'workflow_dispatch' && inputs.mode || 'observations' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 恢复持久状态、分层采集并核验原站点（最多 3 分钟）
        # 没有 football-data 凭据时采集会退化成 openligadb + thesportsdb 免费样本，
        # 而研究冻结与结算都以 football-data 同源为准；缺这个 env 等于整条研究链路空转。
        env:
          # 优先仓库变量：本仓库的 Secrets 里没有 football-data 令牌，导致研究轨道
          # 一直退化成 openligadb+thesportsdb 免费样本、冻结不出 football-data 场次。
          # 恢复 Secrets 后可直接删掉变量，表达式无需再改。
          FOOTBALL_DATA_API_TOKEN: ${{ vars.FOOTBALL_DATA_API_TOKEN || secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTBALL_DATA_API_KEY: ${{ vars.FOOTBALL_DATA_API_KEY || secrets.FOOTBALL_DATA_API_KEY }}
        run: node collector/hosted.mjs --root "$RUNNER_TEMP/dimension-live" --budget-minutes 3 --mode "$HOSTED_MODE"
      - name: 研究轨道生成每日1X2冻结快照和真实FT复盘（不触发正式预测外发）
        # hosted.mjs 只要任一 lane 是 partial（抓取限流、单源失败）就 exit 1，而 partial 是常态。
        # 用 success() 会让日报根本不生成、后续推送无文件可用；这里改为 always()，
        # 由日报自身校验输入，缺数据时它会明确报错而不是静默不生成。
        if: always() && env.HOSTED_MODE == 'research'
        run: node collector/research-daily-report.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 将研究日报同步至受保护Web并核验同reportId（需独立QA准入）
        if: success() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_WEB_ENABLED == 'true'
        run: node collector/publish-research-daily.mjs --root "$RUNNER_TEMP/dimension-live"
      - name: 计算北京日期（跨 runner 幂等键）
        id: bjday
        # step 的自定义 if 在没有 status 函数时仍隐含 success()；hosted.mjs partial 会 exit 1，
        # 导致这里被跳过、outputs.day 为空、后面的标记路径变成目录。必须显式 always()。
        if: always() && env.HOSTED_MODE == 'research'
        run: echo "day=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: 恢复当日推送标记
        id: tgmark
        if: always() && env.HOSTED_MODE == 'research'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tg-sent
          key: tg-sent-${{ steps.bjday.outputs.day }}

      - name: 同步最近一期研究日报到仓库页面（Web 不可用时的降级通道）
        # 线上 Worker 若未发布含 /internal/research-daily 的版本，Web 看板会一直 405；
        # 这里把同一份 latest.md 提交到 docs/latest-daily.md，用户可在 GitHub 页面直接查看。
        # 用 [skip ci] 避免自触发；内容未变则不提交；push 失败不阻断主流程。
        continue-on-error: true
        if: always() && env.HOSTED_MODE == 'research'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          SRC="$RUNNER_TEMP/dimension-live/reports/research-daily/latest.md"
          [ -f "$SRC" ] || { echo "NO_REPORT"; exit 0; }
          mkdir -p docs
          cp "$SRC" docs/latest-daily.md
          git config user.name "dimension-agent"
          git config user.email "agent@dsh.local"
          git add docs/latest-daily.md
          # 必须先 add 再查 staged diff：untracked 文件不在 git diff 里，
          # 首次运行会被误判为 UNCHANGED，导致降级文件永远不生成。
          if git diff --cached --quiet; then echo "UNCHANGED"; exit 0; fi
          git commit -m "chore: 更新最近一期研究日报（降级通道）[skip ci]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main || echo "PUSH_FAILED_DOWNGRADE_CHANNEL"
      - name: 研究日报推送到Telegram（所有者授权的个人研究用途；严格候选与商业门禁保持BLOCKED）
        # Telegram 是独立通道：Web 同步失败（如线上 Worker 版本落后）不应连带阻断每日推送。
        # 幂等：receipt 在 $RUNNER_TEMP 里无法跨 runner 存活，10:10 与 10:40 补偿轮会各发一次；
        # 这里用 Actions cache 存当日标记，已推送过就跳过。只在推送成功后写标记，
        # 失败不会污染标记，下一轮仍会重试。
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 群 ID 不是凭据（发消息仍需 bot token），放仓库变量便于审计与快速修正；
          # 之前 Secrets 里的值与真实群不匹配，Telegram 返回 400 chat not found。
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          DAY="${{ steps.bjday.outputs.day }}"
          [ -n "$DAY" ] || DAY=$(TZ=Asia/Shanghai date +%F)
          MARK="${{ runner.temp }}/tg-sent/$DAY"
          if [ -f "$MARK" ]; then
            echo '{"status":"skipped","code":"ALREADY_SENT_TODAY"}'
            exit 0
          fi
          node collector/publish-research-telegram.mjs --root "$RUNNER_TEMP/dimension-live"
          mkdir -p "${{ runner.temp }}/tg-sent"
          date -u +%FT%TZ > "$MARK"
      - name: 保存当日推送标记
        # 同一天第二次运行会命中已有 cache，save 会因 key 已存在而报错；
        # 标记已经存在时这本来就不需要成功，因此不阻断流水线。
        continue-on-error: true
        if: always() && env.HOSTED_MODE == 'research' && vars.VANTIS_RESEARCH_TELEGRAM_ENABLED == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tg-sent
          key: tg-sent-${{ steps.bjday.outputs.day }}
      - name: 北京时间 09 点后核验并发送当天赛事与数据状态日报
        if: success() && env.HOSTED_MODE == 'observations'
        run: node collector/observation-digest.mjs --root "$RUNNER_TEMP/dimension-live" --mode "$HOSTED_MODE"
      - name: 保留本轮采集与运行证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dimension-live/
            !${{ runner.temp }}/dimension-live/**/*.lock
            !${{ runner.temp }}/dimension-live/**/*.env
            !${{ runner.temp }}/dimension-live/**/.env*
            !${{ runner.temp }}/dimension-live/**/*secret*
            !${{ runner.temp }}/dimension-live/**/*credential*
            !${{ runner.temp }}/dimension-live/**/*token*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 90
      - name: 说明运行与交付边界
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Sites 持久采集与发布

          RELEASE_GATE=BLOCKED：采集公开赛程及未来 24 小时受检赛事的独立报价，网站仅刷新赛程和来源覆盖统计；不包含原始盘口、预测概率或正式候选，不创建预测账本。采集步骤本身不发送通知。
          调度目标为每 5 分钟；GitHub 排队、并发与上游预算可能导致延迟。
          公开赛程仅到 15 分钟采集周期才请求；未到期保持原始观测时间，不把缓存标为刚更新。
          市场观察目标为每 5 分钟，保留来源原始时间；赛程超过 20 分钟或报价过期时拒绝作为最新有效观察发布。
          状态来自原 Sites 的持久存储，以 revision 做条件更新；冲突或超限会停止，不使用空状态替代失败恢复。
          独立日报步骤在北京时间 09 点后，重新核验本轮同一观察报告后申请 Sites 发送当天赛事与数据状态；Sites 持久账本每日防重，未知结果不自动重发。日报不是预测推荐，runner 与 Sites 均不发送自动预测。
          Telegram 凭据仅绑定 Sites 运行环境，runner 仅提交已核验的报告 ID；缺少或错误配置会明确失败，附件仅保存脱敏回执。状态日报接通不代表用户要求的正式预测日报已完成。
          本轮采集与运行记录保留为 90 天附件；research 模式支持每日上午北京时间10:10计划调度，赛前冻结研究1X2、优先核账真实FT，并在私有Actions附件生成独立研究日报。0合格预测按0输出；不调用正式发布/Telegram；计划触发不等于必定准时。
          研究日报与正式商业发布门禁隔离：正式 RELEASE_GATE 仍BLOCKED；严格盘口双独立来源+真实初盘门禁保持不变。私有研究冻结不是已公开发布预测成绩；研究输出只在受限附件内，Web/TG研究展示仍需独立安全验收。
          R2 保存观察报告与当前状态，既有预测账本不删除。
          网站成功仅以同 reportId、同报告摘要、hosted/available 实际回读为准；本工作流不表示 ECS 已部署。
          EOF
