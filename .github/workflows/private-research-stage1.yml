name: 维度足球 Stage1 隔离实采与预测复盘（不发布）
on:
  pull_request:
    paths:
      - '.github/workflows/private-research-stage1.yml'
      - 'collector/**'
      - 'docs/STAGE1-RESEARCH-HANDOFF.md'
  workflow_dispatch:
    inputs:
      research_only:
        description: "仅独立研究采集、内部预测冻结与复盘（不发布）"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: stage1-private-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage1-research:
    # On this Draft PR, exercise the isolation contract and use real public data.
    # Once reviewed/merged, only an explicit dispatch may run it.
    if: (github.event_name == 'pull_request' && github.head_ref == 'feat/scrapling-public-archive-20261102') || (github.event_name == 'workflow_dispatch' && inputs.research_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      RESEARCH_ROOT: ${{ runner.temp }}/dimension-stage1-private
      COLLECTOR_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装固定Scrapling（仅隔离runner）
        run: python3 -m pip install --no-cache-dir --disable-pip-version-check -r config/scrapling-requirements.txt
      - name: 创建单次、无凭据的隔离存档目录
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RESEARCH_ROOT/raw" "$RESEARCH_ROOT/normalized" "$RESEARCH_ROOT/state" "$RESEARCH_ROOT/reports"
      - name: 真实公开德甲赛果采集、不可变SHA保存和新进程回读
        run: |
          set -euo pipefail
          python3 collector/sources/scrapling_archive.py \
            --source openligadb-bl1-history --season 2025 --live \
            --out-root "$RESEARCH_ROOT/raw" > "$RESEARCH_ROOT/scrapling-receipt.json"
          RECORD_DIR=$(python3 -c 'import json,os;print(json.load(open(os.environ["RESEARCH_ROOT"]+"/scrapling-receipt.json"))["directory"])')
          python3 collector/sources/scrapling_archive.py --verify "$RECORD_DIR" \
            > "$RESEARCH_ROOT/raw-verification.json"
          node collector/data/scrapling-history-bridge.mjs "$RECORD_DIR" \
            "$RESEARCH_ROOT/normalized" > "$RESEARCH_ROOT/normalized-receipt.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const root=process.env.RESEARCH_ROOT;
            const a=JSON.parse(readFileSync(root+"/scrapling-receipt.json","utf8"));
            const b=JSON.parse(readFileSync(root+"/normalized-receipt.json","utf8"));
            const source=JSON.parse(readFileSync(root+"/raw-verification.json","utf8"));
            const normalized=JSON.parse(readFileSync(b.outputFile,"utf8"));
            assert.equal(a.receipt.observationMode,"LIVE_SOURCE_HTTP");
            assert.equal(a.receipt.httpStatus,200);
            assert.equal(source.rawSha256,b.rawSha256);
            assert.equal(normalized.rawSha256,b.rawSha256);
            assert.equal(normalized.records.length,306);
            assert.equal(normalized.releaseGate,"BLOCKED");
            assert.equal(normalized.historicalPregameObserved,false);
            assert.equal(normalized.modelReadyForProspective,false);
            writeFileSync(root+"/historical-input.json",JSON.stringify({history:normalized.records})+"\n",{mode:0o600});
            console.log(JSON.stringify({kind:"STAGE1_RAW_IMPORTED",rawSha256:b.rawSha256,records:b.records,releaseGate:b.releaseGate}));
          '
      - name: 执行真实赛果私有核账（不发送Telegram/网站）
        shell: bash
        run: |
          set -euo pipefail
          set +e
          HISTORY_FILE="$RESEARCH_ROOT/historical-input.json" node collector/orchestrate.mjs \
            --lane results --mode private-research --state "$RESEARCH_ROOT/state/state.json" \
            --out "$RESEARCH_ROOT/reports" --budget-minutes 4 \
            > "$RESEARCH_ROOT/results-console.log" 2>&1
          result=$?
          set -e
          echo "$result" > "$RESEARCH_ROOT/results-exit.txt"
          cat "$RESEARCH_ROOT/results-console.log"
          printf 'Results lane exit=%s (see stage1 status; zero prospective scores may be normal)\n' "$result"
      - name: 执行真实赛程及内部研究预测（盘口未认证不生成正式推荐）
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node collector/orchestrate.mjs --lane fixtures --mode private-research \
            --state "$RESEARCH_ROOT/state/state.json" --out "$RESEARCH_ROOT/reports" \
            --budget-minutes 4 > "$RESEARCH_ROOT/fixtures-console.log" 2>&1
          result=$?
          set -e
          echo "$result" > "$RESEARCH_ROOT/fixtures-exit.txt"
          cat "$RESEARCH_ROOT/fixtures-console.log"
          printf 'Fixtures lane exit=%s (see stage1 status; no valid fixture is NOT_READY)\n' "$result"
      - name: 生成仅私有附件可见的日状态及Web试验页，独立确认正式门禁阻断
        run: |
          node scripts/stage1-private-research-report.mjs --root "$RESEARCH_ROOT" --commit "$COLLECTOR_COMMIT"
      - name: 私有存档：RAW/预测冻结/赛后核账及诊断（不发布）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage1-private-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dimension-stage1-private/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
